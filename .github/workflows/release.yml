name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create GitHub Releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode the keystore from the repository secret (base64-encoded) and
      # write it to a temporary file so Gradle can reference it during signing.
      # If the secret is absent the APK is still built but left unsigned.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret found — release APK will be unsigned."
            exit 0
          fi
          # Mask credential values so they are never echoed in the log.
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"        >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS"                        >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD"                  >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease

      # Rename the APK to include the version name extracted from the tag (if
      # this run was triggered by a tag push) or "dev" otherwise.
      - name: Rename APK
        id: rename_apk
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="dev-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          # Gradle produces either a signed or an unsigned APK depending on
          # whether signing config was provided.
          if [ -f "$APK_SRC" ]; then
            FINAL_APK="TextTools-${VERSION}.apk"
            mv "$APK_SRC" "$FINAL_APK"
          else
            FINAL_APK="TextTools-${VERSION}.apk"
            mv "$APK_UNSIGNED" "$FINAL_APK"
          fi
          echo "apk_path=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"

      # Always upload the APK as a workflow artifact so it can be downloaded
      # directly from the Actions run page without needing a full GitHub Release.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextTools-${{ steps.rename_apk.outputs.version }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          if-no-files-found: error

      # Create (or update) a GitHub Release only when a version tag is pushed.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TextTools ${{ steps.rename_apk.outputs.version }}
          draft: false
          prerelease: false
          files: ${{ steps.rename_apk.outputs.apk_path }}
          generate_release_notes: true
